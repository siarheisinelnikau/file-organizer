name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: target
jobs:
  verify:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Provision shared updater source
      shell: pwsh
      run: ./scripts/provision-shared-updater.ps1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
        toolchain: stable
    - run: cargo fmt --all --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked --all-targets -- --test-threads=2
    - run: python scripts/test_versioning.py
    - run: ./scripts/test_package_policy.ps1
      shell: pwsh
    - run: cargo test --locked --test ai http_transport -- --ignored
    - run: ./scripts/package.ps1
      shell: pwsh
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: FileOrganizer-windows-x64
        path: dist/*
    permissions:
      contents: read
    timeout-minutes: 30
