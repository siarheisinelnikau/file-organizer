[package]
name = "file-organizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Rule-based desktop file organization with review and recoverable undo"
repository = "https://github.com/siarheisinelnikau/file-organizer"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
fs2 = "0.4"
notify = "8.2"
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
uuid = { version = "1.26", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
strip = "debuginfo"

